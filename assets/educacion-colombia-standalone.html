document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);
    template = template.replace('<deck-stage width="1920" height="1080">', '<deck-stage width="1920" height="1080" no-rail>');

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-face {\n  font-family: 'Open Sans';\n  font-style: normal;\n  font-weight: 800;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"49b2e849-c3c0-4abf-b211-c6c74905a545\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* Identity */\n  --azul-berlin: #274764;\n  --azul-medio:  #1E6986;\n  --teal:        #5B9A82;\n  --verde-jungla:#4D7D71;\n  --verde-q:     #0D9159;\n  --teal-claro:  #7DB8A2;\n  --teal-pastel: #EAF3EE;\n\n  /* Persona */\n  --naranja:     #F68F28;\n  --amarillo:    #FCCF0E;\n  --amarillo-tx: #8A6A00;\n  --rojo:        #CF2027;\n  --morado:      #563D8B;\n  --morado-dark: #3D2A6B;\n  --morado-soft: #F1ECFB;\n  --morado-mid:  #8669C2;\n\n  /* Neutrals */\n  --blanco:    #FFFFFF;\n  --n-50:      #F8FAFB;\n  --n-100:     #EFF2F4;\n  --n-200:     #DFE5E9;\n  --n-300:     #C4CDD3;\n  --n-500:     #6A7E8B;\n  --n-700:     #2C4250;\n  --n-900:     #0F1F28;\n\n  /* The three type colors */\n  --formal:    var(--azul-berlin);\n  --formal-bg: #E6ECF1;\n  --noformal:  var(--verde-jungla);\n  --noformal-bg: #E8F0EC;\n  --informal:  var(--morado);\n  --informal-bg: var(--morado-soft);\n\n  --font-display: 'Barlow', system-ui, sans-serif;\n  --font-body: 'Open Sans', system-ui, sans-serif;\n}\n\n/* Global reset within slides */\ndeck-stage section,\ndeck-stage section * {\n  box-sizing: border-box;\n  font-family: var(--font-body);\n}\n\ndeck-stage {\n  background: #0a0a0a;\n}\n\n/* Each slide */\n.slide {\n  position: relative;\n  width: 100%;\n  height: 100%;\n  overflow: hidden;\n  background: #fff;\n  color: var(--n-900);\n}\n\n/* Dot-grid background utility */\n.dotgrid {\n  position: absolute;\n  inset: 0;\n  background-image: radial-gradient(circle, var(--n-200) 1px, transparent 1px);\n  background-size: 40px 40px;\n  opacity: 0.5;\n  pointer-events: none;\n}\n\n/* Q speech-bubble watermark */\n.q-watermark {\n  position: absolute;\n  pointer-events: none;\n}\n.q-watermark svg { display: block; }\n\n/* Slide chrome — page number + footer brand */\n.slide-num {\n  position: absolute;\n  left: 60px;\n  bottom: 48px;\n  font-family: var(--font-display);\n  font-weight: 800;\n  font-size: 24px;\n  letter-spacing: 0.24em;\n  color: var(--n-500);\n  z-index: 10;\n}\n.slide-num .slash { opacity: 0.4; margin: 0 6px; }\n.foot-brand {\n  position: absolute;\n  right: 60px;\n  bottom: 48px;\n  display: flex;\n  align-items: center;\n  gap: 14px;\n  z-index: 10;\n}\n.foot-brand img { height: 32px; width: auto; opacity: 0.8; }\n.foot-brand .dot {\n  width: 6px; height: 6px; border-radius: 50%;\n  background: var(--verde-q);\n}\n.foot-brand .label {\n  font-family: var(--font-body);\n  font-size: 24px; font-weight: 700;\n  color: var(--n-500); letter-spacing: 0.08em;\n  text-transform: uppercase;\n}\n\n/* Pre-kicker tag, e.g. \"01 · ESTACIÓN\" */\n.kicker {\n  display: inline-flex;\n  align-items: center;\n  gap: 14px;\n  font-family: var(--font-body);\n  font-size: 24px; font-weight: 700;\n  letter-spacing: 0.24em;\n  text-transform: uppercase;\n  color: var(--n-500);\n}\n.kicker .num {\n  display: inline-flex; align-items: center; justify-content: center;\n  width: 42px; height: 42px; border-radius: 50%;\n  background: var(--teal-pastel);\n  color: var(--verde-q);\n  font-family: var(--font-display);\n  font-weight: 900; font-size: 24px;\n  letter-spacing: 0;\n}\n\n/* Big display titles */\nh1.display {\n  font-family: var(--font-display);\n  font-weight: 900;\n  font-size: 130px;\n  line-height: 0.96;\n  letter-spacing: -0.035em;\n  color: var(--azul-berlin);\n  margin: 0;\n}\nh2.display {\n  font-family: var(--font-display);\n  font-weight: 900;\n  font-size: 92px;\n  line-height: 0.98;\n  letter-spacing: -0.03em;\n  color: var(--azul-berlin);\n  margin: 0;\n}\nh3.display {\n  font-family: var(--font-display);\n  font-weight: 800;\n  font-size: 56px;\n  line-height: 1.02;\n  letter-spacing: -0.02em;\n  color: var(--azul-berlin);\n  margin: 0;\n}\n.lead {\n  font-family: var(--font-body);\n  font-size: 28px; font-weight: 500;\n  color: var(--n-700);\n  line-height: 1.35;\n  max-width: 1100px;\n  text-wrap: pretty;\n}\n\n/* Buttons / pills */\n.pill {\n  display: inline-flex; align-items: center; gap: 10px;\n  padding: 12px 22px;\n  background: #fff;\n  border: 1.5px solid var(--n-200);\n  border-radius: 999px;\n  font-family: var(--font-body);\n  font-weight: 700; font-size: 24px;\n  color: var(--azul-berlin);\n}\n\n/* ─────────────────────────────────────────────────────────────────\n   ANIMATION ENGINE\n   Animations are paused by default. When the slide gets\n   data-deck-active, they play. When it loses it, they pause.\n   We use a custom property --d for stagger delay.\n───────────────────────────────────────────────────────────────── */\n\n/* By default, .anim is hidden. The animation property is ONLY applied\n   when the parent slide is active — this means leaving + re-entering\n   the slide re-attaches the animation, restarting it cleanly. */\n.anim { opacity: 0; }\n\n.slide[data-deck-active] .anim {\n  animation-duration: 0.9s;\n  animation-fill-mode: both;\n  animation-timing-function: cubic-bezier(.2,.7,.3,1);\n  animation-delay: var(--d, 0s);\n}\n\n.slide[data-deck-active] .fade-up    { animation-name: fadeUp; }\n.slide[data-deck-active] .fade-in    { animation-name: fadeIn; }\n.slide[data-deck-active] .fade-down  { animation-name: fadeDown; }\n.slide[data-deck-active] .fade-left  { animation-name: fadeLeft; }\n.slide[data-deck-active] .fade-right { animation-name: fadeRight; }\n.slide[data-deck-active] .scale-in   { animation-name: scaleIn; }\n.slide[data-deck-active] .pop-in     { animation-name: popIn; animation-timing-function: cubic-bezier(.34,1.56,.64,1); }\n.slide[data-deck-active] .draw-in    { animation-name: drawIn; animation-duration: 1.4s; }\n.slide[data-deck-active] .spin-stamp { animation-name: spinStamp; animation-timing-function: cubic-bezier(.34,1.56,.64,1); animation-duration: 1.1s; }\n\n/* Ambient/looping animations also only on active slide */\n.slide[data-deck-active] .glow-pulse {\n  animation: glowPulse 2.6s ease-in-out infinite;\n}\n.slide[data-deck-active] .float-y {\n  animation: floatY 4s ease-in-out infinite;\n}\n.slide[data-deck-active] .float-y.delay {\n  animation-delay: -1.5s;\n}\n\n@keyframes fadeUp { from { opacity:0; transform: translateY(40px); } to { opacity:1; transform:none; } }\n@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }\n@keyframes fadeDown { from { opacity:0; transform: translateY(-40px); } to { opacity:1; transform:none; } }\n@keyframes fadeLeft { from { opacity:0; transform: translateX(-40px); } to { opacity:1; transform:none; } }\n@keyframes fadeRight { from { opacity:0; transform: translateX(40px); } to { opacity:1; transform:none; } }\n@keyframes scaleIn { from { opacity:0; transform: scale(0.85); } to { opacity:1; transform: scale(1); } }\n@keyframes popIn { from { opacity:0; transform: scale(0.5); } to { opacity:1; transform: scale(1); } }\n@keyframes drawIn {\n  0%   { opacity: 0; stroke-dashoffset: 1200; }\n  20%  { opacity: 1; }\n  100% { opacity: 1; stroke-dashoffset: 0; }\n}\n@keyframes spinStamp {\n  0%   { opacity: 0; transform: rotate(-25deg) scale(0.5); }\n  60%  { opacity: 1; transform: rotate(8deg) scale(1.15); }\n  100% { opacity: 1; transform: rotate(-6deg) scale(1); }\n}\n@keyframes glowPulse {\n  0%, 100% { filter: drop-shadow(0 0 0 rgba(86,61,139,0)); }\n  50%      { filter: drop-shadow(0 0 18px rgba(86,61,139,0.65)); }\n}\n@keyframes floatY {\n  0%, 100% { transform: translateY(0); }\n  50%      { transform: translateY(-12px); }\n}\n\n/* Continuous animation pause when slide is inactive is implicit:\n   animation properties are only applied on the active slide via the\n   .slide[data-deck-active] rules above. */\n\n/* ─────────────────────────────────────────────────────── var(--font-body);\n  font-size: 24px; line-height: 1.4;\n  color: var(--n-700);\n}\n\n.s-detail .card-wide { grid-column: span 2; }\n\n.s-detail .card.features ul {\n  list-style: none; padding: 0; margin-top: 4px;\n  display: grid; gap: 10px;\n}\n.s-detail .card.features li {\n  display: flex; align-items: flex-start; gap: 12px;\n  font-family: var(--font-body);\n  font-size: 24px; color: var(--n-700);\n  line-height: 1.35;\n}\n.s-detail .card.features li .bullet {\n  flex-shrink: 0;\n  width: 10px; height: 10px; border-radius: 50%;\n  background: var(--accent-color);\n  margin-top: 10px;\n}\n\n.s-detail .card .flexmeter {\n  display: flex; align-items: center; gap: 14px;\n  margin-top: 6px;\n}\n.s-detail .card .flexmeter .dots {\n  display: flex; gap: 10px;\n}\n.s-detail .card .flexmeter .dots span {\n  width: 22px; height: 22px; border-radius: 50%;\n  background: var(--n-200);\n}\n.s-detail .card .flexmeter .dots span.on {\n  background: var(--accent-color);\n}\n.s-detail .card .flexmeter .word {\n  font-family: var(--font-display);\n  font-weight: 800; font-size: 26px;\n  color: var(--accent-color);\n  letter-spacing: 0.04em;\n  text-transform: uppercase;\n}\n\n/* Accents per slide */\n.s-formal { --accent-color: var(--formal); --accent-bg: var(--formal-bg); }\n.s-noformal { --accent-color: var(--noformal); --accent-bg: var(--noformal-bg); }\n.s-informal { --accent-color: var(--morado); --accent-bg: var(--informal-bg); }\n\n.s-detail .megaicon { background: var(--accent-bg); color: var(--accent-color); }\n\n.s-informal .right { z-index: 1; }\n.s-informal .stamp {\n  position: absolute;\n  left: 350px; top: 660px;\n  z-index: 4;\n}\n.s-informal .stamp-body {\n  background: var(--amarillo);\n  color: var(--azul-berlin);\n  font-family: var(--font-display);\n  font-weight: 900; font-size: 24px;\n  padding: 22px 32px;\n  border-radius: 16px;\n  letter-spacing: 0.06em;\n  text-transform: uppercase;\n  transform: rotate(-6deg);\n  box-shadow: 0 14px 36px rgba(0,0,0,0.
